<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ekspedisi Naskah Nusantara</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Public+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#e7edf0;--panel:#f8fafb;--ink:#0f2230;--mute:#4d6371;--sea:#14707a;--gold:#c98f10;--ok:#1f7a4a;--bad:#b3402e;--line:#b9c6cc;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a22;--panel:#14262f;--ink:#e6eef0;--mute:#9db3bd;--sea:#4fc1c9;--gold:#e5b84a;--ok:#5cc98a;--bad:#ef8a76;--line:#2c4551;--on:#0d1a22}}
:root[data-theme="dark"]{--bg:#0d1a22;--panel:#14262f;--ink:#e6eef0;--mute:#9db3bd;--sea:#4fc1c9;--gold:#e5b84a;--ok:#5cc98a;--bad:#ef8a76;--line:#2c4551;--on:#0d1a22}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Public Sans",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.15;margin:0 0 8px}
h1{font-size:2rem;font-weight:800}h2{font-size:1.4rem}h3{font-size:1.1rem}
nav{display:flex;gap:8px;margin:12px 0}
nav button{flex:1}
button{font:inherit;cursor:pointer;border:2px solid var(--ink);background:var(--panel);color:var(--ink);padding:10px 14px;border-radius:10px;text-align:left}
button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.pri{background:var(--sea);color:var(--on);border-color:var(--sea);font-weight:600;text-align:center}
button.on,.opt.on{background:var(--ink);color:var(--bg)}
button:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--panel);border:2px solid var(--ink);border-radius:14px;padding:16px;margin:12px 0}
.stat{display:flex;gap:16px;flex-wrap:wrap;color:var(--mute);font-size:.9rem}
.opt{display:block;width:100%;margin:8px 0}
.ok{border-color:var(--ok)!important;box-shadow:inset 6px 0 0 var(--ok)}
.no{border-color:var(--bad)!important;box-shadow:inset 6px 0 0 var(--bad)}
.fb{border-left:6px solid var(--gold);padding:8px 12px;margin:12px 0;background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;padding:8px;border:2px dashed var(--line);border-radius:10px}
.chip{padding:8px 10px;border:2px solid var(--ink);border-radius:8px;background:var(--panel);cursor:grab;font-size:.92rem}
.chip.sel{background:var(--gold);color:#111}
.bk{margin:10px 0;border:2px solid var(--sea);border-radius:10px;padding:8px;min-height:60px}
.bk b{color:var(--sea)}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row>span{flex:1}
select{font:inherit;max-width:50%;padding:8px;border:2px solid var(--ink);border-radius:8px;background:var(--panel);color:var(--ink)}
.ord{display:flex;gap:8px;align-items:center;margin:6px 0;padding:8px;border:2px solid var(--ink);border-radius:8px;background:var(--panel)}
.ord span{flex:1}.ord button{padding:4px 10px;text-align:center}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--sea)}
svg{width:100%;height:auto;max-height:520px}
svg text{fill:var(--ink);font:600 13px "Public Sans",sans-serif;paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.node{cursor:pointer}.node circle{fill:var(--panel);stroke:var(--ink);stroke-width:3}
.node.lock{opacity:.45;cursor:not-allowed}.node.done circle{fill:var(--gold)}
.node:focus-visible circle{stroke:var(--gold);stroke-width:5}
summary{cursor:pointer;font-weight:600;padding:6px 0}
table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{border:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.wide{overflow-x:auto}
html{background:#07210f}body{background:transparent}main{position:relative;z-index:1}
h1,main>p,#stage>p.stat{color:#f3f7dd;text-shadow:0 2px 8px #000b}
h1{font-size:2.3rem}
.panel{border-color:#7fb069;box-shadow:0 10px 28px #0007}
#scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;--t1:#0b2e1a;--t2:#14472b;--t3:#2a6b45;background:linear-gradient(#12384a 0%,#3b8f6e 55%,#e0b867 100%)}
#scene.s1{background:linear-gradient(#1d5a78,#6fb8c4 55%,#f0d28a);--t1:#0e3b3a;--t2:#1b5a50;--t3:#3c8575}
#scene.s2{background:linear-gradient(#07210f,#1f5a2c 55%,#8cc152);--t1:#04170a;--t2:#0d3a1a;--t3:#1f6330}
#scene.s3{background:linear-gradient(#120d1c,#2b2140 55%,#6b4a2e);--t1:#0a0710;--t2:#1b1428;--t3:#3a2c44}
#scene.s4{background:linear-gradient(#080c24,#1d2a5c 55%,#5a4a8a);--t1:#05071a;--t2:#10173a;--t3:#26346b}
#scene::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(105deg,#fff0 0 90px,#ffffff16 90px 135px);-webkit-mask:linear-gradient(#000,#0000 70%);mask:linear-gradient(#000,#0000 70%)}
#scene.s3::before,#scene.s4::before{opacity:.25}
#orb{position:absolute;top:7%;right:10%;width:100px;height:100px;border-radius:50%;background:radial-gradient(#fff6c8,#f6d36b 52%,#f6d36b00 72%)}
#scene.s3 #orb{opacity:.2}#scene.s4 #orb{background:radial-gradient(#fff,#dfe6ff 52%,#dfe6ff00 72%)}
.mist{position:absolute;left:-20%;width:140%;height:30vh;bottom:16vh;background:radial-gradient(ellipse at center,#ffffff33,#fff0 70%);animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(12%)}}
#scene svg.tr{position:absolute;left:0;bottom:0;width:100%;max-height:none;background:none;border:0}
#scene svg.tr path{fill:var(--c)}
.ff{position:absolute;width:6px;height:6px;border-radius:50%;background:#f7f08a;box-shadow:0 0 10px 3px #f7f08a99;animation:fl var(--d) ease-in-out infinite alternate,bl 3s ease-in-out infinite;animation-delay:var(--l),var(--l)}
@keyframes fl{to{transform:translate(var(--x),var(--y))}}
@keyframes bl{50%{opacity:.15}}
@media(prefers-reduced-motion:reduce){.ff,.mist{animation:none}}
#stage svg{max-height:680px;background:#06281a99;border:2px solid #7fb069;border-radius:16px}
#stage svg text{fill:#f6f9e4;stroke:#06281a}
#stage svg path{stroke:#e0b867;stroke-width:6;stroke-dasharray:2 12}
.node circle{fill:#1d4a2e;stroke:#e0b867}.node.done circle{fill:#e0b867}
#scene.s5{background:linear-gradient(#2b4a7a,#e58f6a 55%,#f6d36b);--t1:#0b2418;--t2:#173d2a;--t3:#3b6b55}
#scene.s5 #orb{width:160px;height:160px;top:12%;right:calc(50% - 80px)}
input,textarea{font:inherit;width:100%;padding:8px;margin:4px 0 12px;border:2px solid var(--ink);border-radius:8px;background:var(--panel);color:var(--ink)}
label{display:block;font-weight:600}
.big{font-family:"Bricolage Grotesque",sans-serif;font-size:3rem;font-weight:800;line-height:1;margin:8px 0}
.rate{display:flex;gap:8px;margin:6px 0 14px}.rate button{flex:1;text-align:center}
nav{gap:10px}nav button{display:flex;align-items:center;gap:10px;padding:8px 12px;border-color:#7fb069;box-shadow:0 4px 14px #0006;transition:transform .15s}
nav button:hover{transform:translateY(-2px)}
nav button.on{background:linear-gradient(135deg,#1f6b3a,#12401f);color:#f3f7dd;border-color:#e0b867;box-shadow:0 0 0 3px #e0b86766,0 6px 16px #0007}
nav button b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.05rem;line-height:1.1}
nav button small{display:block;font-size:.75rem;opacity:.8;margin-top:2px}
.ic{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:50%;background:#e0b867;color:#111;font-size:1.35rem;box-shadow:inset 0 -3px 0 #0003}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.tags span{background:#06281acc;border:1.5px solid #e0b867;color:#f3f7dd;border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:600;text-shadow:none}
.gd h2{font-size:1.7rem;border-bottom:3px dashed var(--gold);padding-bottom:8px;margin-bottom:12px}
.goal{border-left:6px solid var(--gold);background:var(--bg);border-radius:0 12px 12px 0;padding:10px 14px}
.gd details{border:2px solid var(--line);border-radius:12px;padding:4px 14px;margin:10px 0;background:var(--bg)}
.gd details[open]{border-color:var(--sea)}
.gd summary{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.1rem;font-weight:800;padding:8px 0}
.gd li{margin:6px 0}.gd li::marker{color:var(--gold);font-weight:800}
.gd th{background:var(--sea);color:var(--on)}
.qt{display:inline-block;background:var(--sea);color:var(--on);border-radius:999px;padding:3px 14px;font-size:.8rem;font-weight:700;margin-top:12px}
.stars{font-size:2.4rem;margin:0}.stars span{display:inline-block;color:var(--mute)}
.stars span.on{color:var(--gold);text-shadow:0 0 14px #e0b867aa;animation:pop .6s both;animation-delay:var(--d)}
@keyframes pop{0%{transform:scale(0) rotate(-90deg);opacity:0}70%{transform:scale(1.4) rotate(10deg)}100%{transform:scale(1);opacity:1}}
.cf{position:fixed;top:-16px;z-index:30;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:cf var(--t) linear forwards}
@keyframes cf{to{transform:translate(var(--x),108vh) rotate(var(--r))}}
main{padding-top:80px!important}
.sndbtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;z-index:20;width:62px;height:62px;border-radius:50%;padding:0;text-align:center;font-size:1.6rem;line-height:1;background:var(--panel);border:2px solid #e0b867;box-shadow:0 4px 14px #0008}
.badge{position:relative;display:inline-flex;align-items:center;gap:10px;margin:10px 0 14px;padding:10px 24px 10px 12px;border-radius:999px;background:linear-gradient(110deg,#c98f10 30%,#ffe9a0 50%,#c98f10 70%);background-size:250% 100%;color:#1a1200;border:2px solid #fff3c0;box-shadow:0 0 18px #e0b867aa;animation:shine 2.4s ease-in-out infinite,drop .7s cubic-bezier(.3,1.6,.5,1) both}
.badge .bi{font-size:1.8rem}
.badge i{position:absolute;font-style:normal;font-size:.95rem;animation:tw 1.6s ease-in-out infinite;animation-delay:calc(var(--a)*.5s)}
.badge i:nth-of-type(1){top:-10px;left:18%}.badge i:nth-of-type(2){top:-8px;right:10%}.badge i:nth-of-type(3){bottom:-8px;right:42%}
@keyframes shine{to{background-position:-150% 0}}
@keyframes drop{0%{transform:translateY(-30px) scale(.5);opacity:0}}
@keyframes tw{50%{transform:scale(1.6) rotate(20deg);opacity:.4}}
.cb{position:fixed;top:28%;left:50%;transform:translateX(-50%);z-index:40;font:800 2.2rem "Bricolage Grotesque",system-ui,sans-serif;color:#ffe9a0;text-shadow:0 0 18px #e58f6a,0 3px 0 #7a3b00;pointer-events:none;white-space:nowrap;animation:cbk 1.2s ease-out forwards}
@keyframes cbk{0%{transform:translateX(-50%) scale(.3);opacity:0}25%{transform:translateX(-50%) scale(1.3);opacity:1}100%{transform:translateX(-50%) translateY(-60px) scale(1);opacity:0}}
.sndbtn.mu{left:84px;opacity:.6}
@media(prefers-reduced-motion:reduce){.badge,.badge i{animation:none}}
@media(prefers-reduced-motion:reduce){.cf{display:none}.stars span.on{animation:none}}
.story{border-left:5px solid var(--gold);padding:6px 12px;font-style:italic;background:var(--bg);border-radius:0 10px 10px 0}

.devbtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:20;width:62px;height:62px;overflow:hidden;border-radius:50%;padding:0;text-align:center;font-size:1.3rem;line-height:1;background:var(--panel);border:2px solid #e0b867;box-shadow:0 4px 14px #0008}
.devbtn img{width:100%;height:100%;display:block;object-fit:cover;transform:scale(1.08)}
.dev{position:fixed;top:calc(env(safe-area-inset-top,0px) + 82px);right:12px;z-index:20;width:min(290px,calc(100vw - 24px));background:var(--panel);color:var(--ink);border:2px solid #e0b867;border-radius:14px;padding:14px;box-shadow:0 12px 32px #000a;text-align:center}
.dev[hidden]{display:none}
.av{width:150px;height:150px;border-radius:50%;overflow:hidden;margin:0 auto 12px;border:4px solid #e0b867;box-shadow:0 0 0 3px var(--panel),0 6px 16px #0006;background:#000}
.dev .av img{width:100%;height:100%;display:block;object-fit:cover}
.dev p{margin:2px 0}.dev .nm{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.15rem}
.dev .sm{color:var(--mute);font-size:.85rem}
</style>
</head>

function frac(q){const v=A.v;
 if(q.t=="pg")return v===q.a?1:0;
 if(q.t=="tf")return v===(q.a?1:0)?1:0;
 if(q.t=="pgk"){const h=v.filter(x=>q.a.includes(x)).length,w=v.length-h;return Math.max(0,(h-w)/q.a.length)}
 if(q.t=="dnd")return q.items.filter((it,i)=>v[i]===it[1]).length/q.items.length;
 if(q.t=="match")return v.filter((x,i)=>x===String(i)).length/v.length;
 if(q.t=="order")return v.filter((x,p)=>x==p).length/v.length}

function sfx(k){try{navigator.vibrate&&navigator.vibrate({ok:40,part:[30,30,30],no:[70,40,70],win:[80,40,80,40,200],lose:120}[k])}catch(e){}if(!SND)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const seq={ok:[[660,.1],[880,.18]],part:[[520,.12],[600,.14]],no:[[220,.16],[160,.24]],win:[[523,.12],[659,.12],[784,.12],[1047,.4]],lose:[[330,.18],[262,.18],[196,.35]]}[k];let t=AC.currentTime+.02;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=(k=="no"||k=="lose")?"triangle":"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.9})}catch(e){}}

function chirp(){const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime,b=2200+Math.random()*1200;o.frequency.setValueAtTime(b,t);o.frequency.exponentialRampToValueAtTime(b*1.35,t+.09);o.frequency.exponentialRampToValueAtTime(b*.9,t+.18);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.03,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(g);g.connect(MG);o.start(t);o.stop(t+.25)}
function musOn(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume();MG=AC.createGain();MG.gain.value=.0001;MG.gain.exponentialRampToValueAtTime(.6,AC.currentTime+1.5);MG.connect(AC.destination);const lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=500;lp.connect(MG);MO=[110,165.2,220.5].map((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=f;g.gain.value=.05/(i+1);o.connect(g);g.connect(lp);o.start();return o});const N=[330,392,440,524,588,660];let k=0;MT=setInterval(()=>{k++;if(Math.random()<.7)bell(N[Math.random()*N.length|0],.05,2.6);if(k%3==0&&Math.random()<.6)chirp()},2200)}catch(e){}}

function nz(t,d,v,hp,dst){const n=Math.max(1,AC.sampleRate*d|0),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;f.type="highpass";f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(dst||AC.destination);s.start(t)}

function sfx(k){try{navigator.vibrate&&navigator.vibrate({ok:40,part:[30,30,30],no:[70,40,70],win:[80,40,80,40,200],lose:120,go:30}[k])}catch(e){}
 if(k=="ok")ST++;else if(k=="no")ST=0;
 if(k=="ok"&&ST>=2)combo();
 if(!SND)return;try{AX();const t=AC.currentTime+.01,m=Math.pow(1.122,Math.min(Math.max(ST-1,0),6));
 const S={ok:[[784,.07],[1047,.07],[1319,.18]],part:[[587,.08],[698,.14]],no:[[196,.12,"sawtooth"],[147,.3,"sawtooth"]],win:[[523,.1],[659,.1],[784,.1],[1047,.12],[784,.08],[1047,.08],[1319,.5]],lose:[[392,.15],[330,.15],[262,.15],[196,.55,"sawtooth"]],go:[[330,.07],[440,.07],[660,.07],[880,.2]]}[k];
 let x=t;S.forEach(([f,d,w])=>{tn(f*(k=="ok"?m:1),x,d,w,k=="no"?.2:.14);x+=d*.95});
 if(k=="ok")tn(131*m,t,.25,"triangle",.25);
 if(k=="win"){tn(131,t,.9,"sawtooth",.12);nz(t+.55,.7,.12,3000)}
 if(k=="no")nz(t,.12,.15,800)}catch(e){}}
function musOn(){try{AX();MG=AC.createGain();MG.gain.value=.0001;MG.gain.exponentialRampToValueAtTime(.7,AC.currentTime+.6);MG.connect(AC.destination);
 const R=[110,87.31,130.81,98],C=[[440,523.25,659.25],[349.23,440,523.25],[523.25,659.25,784],[392,493.88,587.33]],q=60/132/4;let nt=AC.currentTime+.1,s=0;
 const step=(s,t)=>{const bar=s>>4,i=s&15,ch=C[bar];
  if(i%4==0){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(g);g.connect(MG);o.start(t);o.stop(t+.22)}
  if(i==4||i==12)nz(t,.14,.16,1500,MG);
  if(i%2==0)nz(t,.04,.045,7000,MG);
  if(i%2==0)tn(R[bar]*(i%8==6?2:1),t,.1,"square",.09,MG);
  tn(ch[[0,1,2,1][i%4]]*((i>=8&&i%4==2)?2:1),t,.09,"square",.035,MG)};
 MT=setInterval(()=>{while(nt<AC.currentTime+.25){step(s,nt);nt+=q;s=(s+1)%64}},50)}catch(e){}}
function musOff(){clearInterval(MT);try{MG.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.3)}catch(e){}}
function confetti(n){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const c=["#e0b867","#7fb069","#f3f7dd","#e58f6a","#4fc1c9"];let h="";for(let i=0;i<n;i++)h+=`<i class="cf" style="left:${Math.random()*100}%;background:${c[i%5]};--x:${Math.random()*140-70}px;--r:${Math.random()*720}deg;--t:${2.2+Math.random()*1.8}s;animation-delay:${Math.random()*.6}s"></i>`;const d=document.createElement("div");d.innerHTML=h;document.body.appendChild(d);setTimeout(()=>d.remove(),5000)}
function zoneEnd(){const z=Z[S.z],m=z.q.length*z.p,pct=Math.round(S.zp/m*100),ok=pct>=70,stars=pct==100?3:pct>=85?2:ok?1:0;
 const prev=S.res[S.z];if(!prev||S.zp>prev.p)S.res[S.z]={p:S.zp,ok:ok||(prev&&prev.ok)};
 if(ok&&S.z+1==S.un&&S.un<Z.length)S.un++;
